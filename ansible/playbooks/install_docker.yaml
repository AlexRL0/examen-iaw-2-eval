---
- name: Instalar Docker y Docker Compose
  hosts: ejer1
  become: yes
  vars_files:
    - ../vars/variables.yaml
  tasks:
    - name: Actualizar lista de paquetes
      apt:
        update_cache: yes

    - name: Instalar dependencias necesarias
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Añadir la clave GPG de Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Añadir el repositorio de Docker
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present

    - name: Actualizar lista de paquetes nuevamente
      apt:
        update_cache: yes

    - name: Instalar Docker
      apt:
        name: docker-ce={{ docker_version }}
        state: present

    - name: Añadir usuario al grupo de Docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Descargar Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-`uname -s`-`uname -m`"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Verificar la instalación de Docker Compose
      command: docker-compose --version

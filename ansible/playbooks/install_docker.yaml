---
- name: Instalar Docker y Docker Compose
  hosts: ejer2
  become: yes
  vars_files:
    - ../vars/variables.yaml
  tasks:
    - name: Actualizar lista de paquetes
      apt:
        update_cache: yes

    - name: Instalar dependencias necesarias
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Añadir la clave GPG de Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Añadir el repositorio de Docker
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present

    - name: Actualizar lista de paquetes nuevamente
      apt:
        update_cache: yes

    - name: Instalar Docker
      apt:
        name: docker-ce
        state: present

    - name: Añadir usuario al grupo de Docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Descargar Docker Compose
      shell: "curl -L https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-$(uname -s)-$(uname -m) -o /usr/local/bin/docker-compose"
      
    - name: Dar permisos de ejecución a Docker Compose
      file:
        path: /usr/local/bin/docker-compose
        mode: '0755'
        state: file

    - name: Verificar la instalación de Docker Compose
      command: /usr/local/bin/docker-compose --version